kind = "mobile"
previewPath = "/mobile/"
title = "GXEON Mobile"
version = "1.0.0"
id = "artifacts/gxeon-dashboard-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 21447

[services.development]
run = "pnpm --filter @workspace/gxeon-dashboard-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gxeon-dashboard-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/gxeon-dashboard-mobile", "run", "serve" ]

[services.env]
PORT = "21447"
BASE_PATH = "/mobile/"
