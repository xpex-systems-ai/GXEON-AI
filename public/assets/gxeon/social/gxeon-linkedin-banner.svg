<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="512" viewBox="0 0 2048 512" role="img" aria-label="Gxeon Systems AI official logo banner">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#060606"/>
      <stop offset="0.52" stop-color="#10100d"/>
      <stop offset="1" stop-color="#030303"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#fff8d6"/>
      <stop offset="0.22" stop-color="#f8d889"/>
      <stop offset="0.48" stop-color="#c9902d"/>
      <stop offset="0.72" stop-color="#ffe8a3"/>
      <stop offset="1" stop-color="#8b5b18"/>
