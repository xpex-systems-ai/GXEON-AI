[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  VITE_GELATO_RPC_URL = "https://rpc.gelato.network/v2/sep/rpc/ded794a60b3b486891820911c7f04c12"
  VITE_GXEON_VAULT_ADDRESS = "0x3955d559594C506C39710345224976767714C806"
  VITE_API_URL = "https://gxeon-production.up.railway.app"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
