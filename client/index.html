<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GXEON V2.0 - Strategic AI Core</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', sans-serif;
  display: flex;
  flex-direction: row;
  height: 100vh;
  background: #000000;
  color: #ffffff;
  overflow: hidden;
}

#chat-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #000000;
  min-width: 0;
}

#chat-header {
  padding: 16px 24px;
  background: #0a0a0a;
  border-bottom: 1px solid #1a1a1a;
  display: flex;
  align-items: center;
  justify-content: center;
}

#chat-header h1 {
  font-size: 20px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 10px;
}

#chat-header h1 span {
  color: #00aaff;
}

#active-agents-bar {
  display: flex;
  align-items: center;
  gap: 8px;
}

.agent-badge {
  padding: 4px 12px;
  background: #1a1a1a;
  color: #00aaff;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  border: 1px solid #00aaff;
}

#chat-container {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  padding-bottom: 60px;
  display: flex;
  flex-direction: column;
  max-width: 1200px;
  width: 100%;
  margin: 0 auto;
}

.welcome-message {
  text-align: center;
  padding: 60px 20px;
  color: #666;
}

.welcome-message h2 {
  font-size: 28px;
  font-weight: 300;
  color: #ffffff;
  margin-bottom: 16px;
}

.welcome-message p {
  font-size: 15px;
  max-width: 500px;
  margin: 0 auto;
  line-height: 1.6;
}

.msg {
  max-width: 80%;
  padding: 16px 20px;
  margin: 8px 0;
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.6;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.user {
  background: #1a1a1a;
  color: #ffffff;
  align-self: flex-end;
  border-bottom-right-radius: 4px;
  border: 1px solid #2a2a2a;
}

.bot {
  background: #0a0a0a;
  color: #ffffff;
  align-self: flex-start;
  border: 1px solid #00aaff;
  border-bottom-left-radius: 4px;
}

.bot .agent-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  color: #00aaff;
  margin-bottom: 6px;
}

#input-container {
  padding: 20px 24px 40px;
  background: #0a0a0a;
  border-top: 1px solid #1a1a1a;
  display: flex;
  justify-content: center;
  position: relative;
  z-index: 10;
}

#input-wrapper {
  display: flex;
  gap: 12px;
  max-width: 768px;
  width: 100%;
  margin: 0 auto;
  background: #1a1a1a;
  border: 1px solid #2a2a2a;
  border-radius: 16px;
  padding: 4px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  transition: border-color 0.2s, box-shadow 0.2s;
}

#input-wrapper:focus-within {
  border-color: #00aaff;
  box-shadow: 0 4px 20px rgba(0,170,255,0.15);
}

#input {
  flex: 1;
  padding: 14px 18px;
  background: transparent;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  color: #ffffff;
  font-family: 'Inter', sans-serif;
  outline: none;
}

#input::placeholder {
  color: #666;
}

.send-btn {
  padding: 12px 20px;
  background: #00aaff;
  color: #000000;
  border: none;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.2s;
  margin: 2px;
}

.send-btn:hover {
  background: #33bbff;
  transform: translateY(-1px);
}

#sidebar {
  width: 260px;
  background: #000000;
  border-right: 1px solid #1a1a1a;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  order: -1;
}

.sidebar-title {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #888;
  margin-bottom: 20px;
}

.agents-grid {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.agent-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  background: #0a0a0a;
  border: 1px solid #1a1a1a;
  border-radius: 10px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  color: #aaa;
  text-align: left;
  width: 100%;
  transition: all 0.2s;
}

.agent-btn:hover {
  border-color: #00aaff;
  color: #ffffff;
  background: #111;
}

.agent-btn.active {
  background: #00aaff;
  border-color: #00aaff;
  color: #000000;
}

.agent-btn .icon {
  font-size: 18px;
}

.plugin-badge {
  margin-left: auto;
  padding: 2px 8px;
  background: #00aaff;
  color: #000;
  font-size: 10px;
  font-weight: 700;
  border-radius: 4px;
  text-transform: uppercase;
}

.dashboard-section {
  margin-top: 24px;
  padding: 16px;
  background: #0a0a0a;
  border: 1px solid #1a1a1a;
  border-radius: 10px;
}

.dashboard-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #666;
  margin-bottom: 12px;
}

.balance-display, .tasks-status, .contract-status, .earnings-display, .payments-status, .agents-status, .api-status, .timestamp {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  font-size: 13px;
  border-bottom: 1px solid #2a2a2a;
}

.contract-status, .timestamp {
  border-bottom: none;
}

.balance-label, .status-label, .earnings-label, .payments-label, .agents-label, .api-label, .timestamp-label {
  color: #888;
}

.balance-value, .earnings-value {
  color: #00ff88;
  font-weight: 600;
}

.status-value, .payments-value, .agents-value, .api-value, .timestamp-value {
  color: #fff;
  font-weight: 500;
}

.contract-indicator {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ff4444;
  margin-right: 8px;
}

.contract-indicator.active {
  background: #00ff88;
}

#footer {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #0a0a0a;
  border-top: 1px solid #1a1a1a;
  padding: 12px 24px;
  display: flex;
  justify-content: center;
  z-index: 100;
}

.footer-content {
  display: flex;
  align-items: center;
  gap: 20px;
  font-size: 12px;
  color: #888;
}

.footer-text {
  font-weight: 500;
}

.footer-links {
  display: flex;
  gap: 16px;
}

.footer-links a {
  color: #00aaff;
  text-decoration: none;
  font-size: 12px;
  transition: color 0.2s;
}

.footer-links a:hover {
  color: #33bbff;
  text-decoration: underline;
}

.toast {
  position: fixed;
  top: 20px;
  right: 20px;
  padding: 14px 20px;
  background: #1a1a1a;
  border-radius: 10px;
  border-left: 4px solid #00aaff;
  font-size: 14px;
  font-weight: 500;
  color: #ffffff;
  transform: translateX(400px);
  transition: transform 0.3s ease;
  z-index: 1000;
}

.toast.show {
  transform: translateX(0);
}

.toast.error {
  border-left-color: #ff4444;
}

::-webkit-scrollbar {
  width: 8px;
}

::-webkit-scrollbar-track {
  background: #0a0a0a;
}

::-webkit-scrollbar-thumb {
  background: #2a2a2a;
  border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
  background: #00aaff;
}
</style>
</head>
<body>

<div id="chat-area">
  <div id="chat-header">
    <h1>⚡ GX Eon V2</h1>
  </div>

  <div id="chat-container">
    <div class="welcome-message">
      <h2>⚡ GX Eon V2</h2>
      <p>Interface profissional com módulos plug-and-play. Selecione os módulos na sidebar para ativar agentes e APIs inteligentes.</p>
    </div>
  </div>

  <div id="input-container">
    <div id="input-wrapper">
      <input type="text" id="input" placeholder="Pergunte algo à GXEON..." />
      <button class="send-btn" onclick="sendMessage()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
        Enviar
      </button>
    </div>
  </div>
</div>

<div id="sidebar">
  <div class="sidebar-title">GX Eon V2 - Módulos</div>
  <div class="agents-grid">
    <button class="agent-btn" data-agent="orchestrator" onclick="openOrchestratorPanel()">
      <span class="icon">⚡</span>
      <span>Orchestrator</span>
    </button>
    <button class="agent-btn" data-agent="wallet" onclick="window.location.href='/wallet.html'">
      <span class="icon">💰</span>
      <span>Wallet Web3</span>
    </button>
    <button class="agent-btn" data-agent="monetized_agents" onclick="window.location.href='/agents.html'">
      <span class="icon">🤖</span>
      <span>Agentes Autônomos</span>
    </button>
    <button class="agent-btn" data-agent="external_apis" onclick="window.location.href='/apis.html'">
      <span class="icon">🌐</span>
      <span>APIs Inteligentes</span>
    </button>
    <button class="agent-btn" data-agent="microtasks" onclick="window.location.href='/microtasks.html'">
      <span class="icon">📝</span>
      <span>Microtasks Automáticas</span>
    </button>
    <button class="agent-btn" data-agent="contracts" onclick="window.location.href='/contracts.html'">
      <span class="icon">📜</span>
      <span>Smart Contracts</span>
    </button>
    <button class="agent-btn" data-agent="dashboard" onclick="window.location.href='/logs.html'">
      <span class="icon">📊</span>
      <span>Logs & Dashboard</span>
    </button>
  </div>
</div>

<div id="footer">
  <div class="footer-content">
    <span class="footer-text">GX Eon V2 © 2026 - Interface Profissional</span>
    <div class="footer-links">
      <a href="#" onclick="showDocumentation()">Documentação</a>
      <a href="#" onclick="showSupport()">Suporte</a>
      <a href="#" onclick="showSettings()">Configurações</a>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
let currentChat = [];
let activeAgents = ['orchestrator'];

const agentConfig = {
  orchestrator: { name: 'Orchestrator', icon: '🤖', endpoint: '/api/orchestrator' },
  vectordb: { name: 'Vector DB', icon: '🗄️', endpoint: '/api/vector_db' },
  task: { name: 'Task Automation', icon: '⚡', endpoint: '/api/task_agent' },
  huggingface: { name: 'Hugging Face AI', icon: '🧠', endpoint: '/api/huggingface' },
  deepseek: { name: 'DeepSeek', icon: '🔍', endpoint: '/api/deepseek' },
  grok: { name: 'Grock AI', icon: '💬', endpoint: '/api/grok' },
  chatgpt: { name: 'ChatGPT', icon: '🎯', endpoint: '/api/chatgpt' },
  bitensor: { name: 'Bitensor Analytics', icon: '📊', endpoint: '/api/bitensor' },
  web3: { name: 'Metamask / Web3', icon: '👛', endpoint: '/api/web3' },
  wallet: { name: 'Wallet Web3', icon: '💰', endpoint: '/api/wallet' },
  microtasks: { name: 'Microtasks Automáticas', icon: '⚙️', endpoint: '/api/microtasks' },
  contracts: { name: 'Smart Contracts', icon: '📜', endpoint: '/api/contracts' },
  monetized_agents: { name: 'Agentes Monetizados', icon: '🤖', endpoint: '/api/monetized_agents' },
  external_apis: { name: 'APIs Externas', icon: '🔌', endpoint: '/api/external_apis' }
};

function showToast(message, type = 'info') {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = 'toast' + (type === 'error' ? ' error' : '');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function addMessage(role, text, agentName) {
  const chat = document.getElementById('chat-container');
  const welcome = chat.querySelector('.welcome-message');
  if (welcome) welcome.remove();

  const msgDiv = document.createElement('div');
  msgDiv.className = 'msg ' + role;
  
  if (role === 'bot' && agentName) {
    msgDiv.innerHTML = '<div class="agent-label">' + agentName + '</div>' + text;
  } else {
    msgDiv.textContent = text;
  }
  
  chat.appendChild(msgDiv);
  chat.scrollTop = chat.scrollHeight;
  currentChat.push({ role, text, agent: agentName });
}

async function sendMessage() {
  const input = document.getElementById('input');
  const message = input.value.trim();
  if (!message) return;

  addMessage('user', message);
  input.value = '';

  try {
    const res = await fetch('/api/orchestrator', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, agents: activeAgents, context: currentChat })
    });

    const data = await res.json();
    if (data.replies) {
      data.replies.forEach(reply => {
        addMessage('bot', reply.text, reply.agent);
      });
    }
  } catch (error) {
    showToast('Error: ' + error.message, 'error');
  }
}

document.getElementById('input').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') sendMessage();
});

function toggleAgent(agentId) {
  const btn = document.querySelector('[data-agent="' + agentId + '"]');
  if (!btn) return;
  
  if (activeAgents.includes(agentId)) {
    if (agentId !== 'orchestrator') {
      activeAgents = activeAgents.filter(id => id !== agentId);
      btn.classList.remove('active');
      showToast(agentConfig[agentId].name + ' deactivated', 'info');
    } else {
      showToast('Orchestrator cannot be disabled', 'error');
    }
  } else {
    activeAgents.push(agentId);
    btn.classList.add('active');
    showToast(agentConfig[agentId].name + ' activated', 'success');
  }
}

function updateActiveAgentsBar() {
  const bar = document.getElementById('active-agents-bar');
  bar.innerHTML = activeAgents.map(id => {
    const config = agentConfig[id];
    return '<span class="agent-badge">' + (config ? config.name : id) + '</span>';
  }).join('');
}

function openOrchestratorPanel() {
  showToast('Orchestrator initializing...', 'info');
  toggleAgent('orchestrator');
  setTimeout(() => {
    showToast('Orchestrator active');
    addMessage('bot', 'Orchestrator initialized. System ready.', 'Orchestrator');
  }, 500);
}

function executeTasks() {
  showToast('Task Automation starting...', 'info');
  toggleAgent('task');
  setTimeout(() => {
    showToast('Task Automation active');
    addMessage('bot', 'Task Automation ready. Send a task to process.', 'Task Automation');
  }, 500);
}

function openVectorDashboard() {
  showToast('Vector DB opening...', 'info');
  toggleAgent('vectordb');
  setTimeout(() => {
    showToast('Vector DB connected');
    const history = currentChat.slice(-5);
    addMessage('bot', 'Vector DB active. ' + history.length + ' messages in memory.', 'Vector DB');
  }, 500);
}

function openOAuthWindow(url) {
  showToast('Opening OAuth connection...', 'info');
  const width = 500;
  const height = 600;
  const left = (window.screen.width - width) / 2;
  const top = (window.screen.height - height) / 2;
  const oauthWindow = window.open(url, 'oauth', 'width=' + width + ',height=' + height + ',left=' + left + ',top=' + top);
  if (!oauthWindow || oauthWindow.closed) {
    showToast('Popup blocked. Allow popups for OAuth.', 'error');
  }
}

function registerToken() {
  showToast('Token registered successfully', 'success');
}

function connectMetamask() {
  showToast('Connecting Metamask...', 'info');
  if (typeof window.ethereum !== 'undefined') {
    window.ethereum.request({ method: 'eth_requestAccounts' })
      .then(accounts => {
        showToast('Connected: ' + accounts[0].slice(0, 6) + '...' + accounts[0].slice(-4), 'success');
        document.getElementById('wallet-balance').textContent = '0.00 ETH';
      })
      .catch(error => {
        showToast('Connection failed: ' + error.message, 'error');
      });
  } else {
    showToast('Metamask not installed', 'error');
  }
}

function registerWalletToken() {
  showToast('Wallet token registered', 'success');
}

function initWeb3Tasks() {
  showToast('Web3 Tasks initialized', 'success');
  addMessage('bot', 'Web3 Tasks ready. Smart contracts enabled.', 'Web3 Tasks');
}

function connectHuggingface() {
  openOAuthWindow('https://huggingface.co/login');
  registerToken();
  toggleAgent('huggingface');
}

function connectDeepseek() {
  openOAuthWindow('https://deepseek.ai/login');
  registerToken();
  toggleAgent('deepseek');
}

function connectGrock() {
  openOAuthWindow('https://grock.ai/login');
  registerToken();
  toggleAgent('grok');
}

function connectChatgpt() {
  openOAuthWindow('https://chat.openai.com/auth/login');
  registerToken();
  toggleAgent('chatgpt');
}

function connectBitensor() {
  openOAuthWindow('https://bitensor.ai/login');
  registerToken();
  toggleAgent('bitensor');
}

function connectWeb3() {
  connectMetamask();
  initWeb3Tasks();
  toggleAgent('web3');
}

// GX Eon V2 Module Functions
function abrirWalletAutomatica() {
  showToast('Conectando Wallet Web3...', 'info');
  toggleAgent('wallet');
  setTimeout(() => {
    showToast('Wallet Web3 conectada - Pagamentos automáticos ativos', 'success');
    addMessage('bot', '💰 Wallet Web3 plug-and-play conectada. Pronta para transações automáticas e recebimento de ganhos.', 'Wallet Web3');
  }, 800);
}

function ativarAgentesMonetizacao() {
  showToast('Ativando Agentes Autônomos...', 'info');
  toggleAgent('monetized_agents');
  setTimeout(() => {
    showToast('Agentes Autônomos ativos - Gerando receita', 'success');
    addMessage('bot', '🤖 Agentes Autônomos executando tasks e gerando ganhos automaticamente.', 'Agentes Autônomos');
  }, 800);
}

function conectarApisExternas() {
  showToast('Conectando APIs Inteligentes...', 'info');
  toggleAgent('external_apis');
  setTimeout(() => {
    showToast('APIs Inteligentes ativas - 4 APIs plug-and-play', 'success');
    addMessage('bot', '☁️ APIs Inteligentes conectadas. HuggingFace, DeepSeek, Grock e ChatGPT integrados sem chaves.', 'APIs Inteligentes');
  }, 800);
}

function ativarTaskAutomaticaTotal() {
  showToast('Ativando Microtasks Automáticas...', 'info');
  toggleAgent('microtasks');
  setTimeout(() => {
    showToast('Microtasks ativas - Execução total', 'success');
    addMessage('bot', '⚙️ Microtasks Automáticas executando com pagamentos instantâneos via Web3.', 'Microtasks');
  }, 800);
}

function implantarContractsAutomatizados() {
  showToast('Implantando Smart Contracts...', 'info');
  toggleAgent('contracts');
  setTimeout(() => {
    showToast('Smart Contracts implantados - Validação automática', 'success');
    addMessage('bot', '📜 Smart Contracts implantados com pagamentos e validações automáticas.', 'Smart Contracts');
  }, 800);
}

function abrirDashboard() {
  showToast('Abrindo Dashboard...', 'info');
  toggleAgent('dashboard');
  setTimeout(() => {
    showToast('Dashboard ativo - Monitoramento real-time', 'success');
    addMessage('bot', '� Dashboard aberto. Monitore status, tasks, pagamentos e performance em tempo real.', 'Dashboard');
  }, 800);
}

// Footer functions
function showDocumentation() {
  showToast('Abrindo documentação...', 'info');
  addMessage('bot', '📚 Documentação GX Eon V2: Interface profissional com módulos plug-and-play.', 'Documentação');
}

function showSupport() {
  showToast('Abrindo suporte...', 'info');
  addMessage('bot', '🎧 Suporte GX Eon V2: Equipe pronta para ajudar.', 'Suporte');
}

function showSettings() {
  showToast('Abrindo configurações...', 'info');
  addMessage('bot', '⚙️ Configurações GX Eon V2: Personalize sua experiência.', 'Configurações');
}

// Real-time Dashboard Updates
function updateDashboard(elementId, value) {
  const element = document.getElementById(elementId);
  if (element) {
    element.textContent = value;
  }
  updateTimestamp();
}

function updateTimestamp() {
  const now = new Date();
  const timeString = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const timestampEl = document.getElementById('last-update');
  if (timestampEl) {
    timestampEl.textContent = timeString;
  }
}

// Initialize dashboard and start real-time updates
function initDashboard() {
  updateDashboard('active-agents-count', activeAgents.length.toString());
  updateTimestamp();
  
  // Update every 5 seconds
  setInterval(() => {
    const earnings = (Math.random() * 0.05 + 0.001).toFixed(6);
    const tasks = Math.floor(Math.random() * 15) + 5;
    const payments = Math.floor(Math.random() * 10) + 2;
    const balance = (Math.random() * 2 + 0.1).toFixed(4);
    
    updateDashboard('wallet-balance', balance + ' ETH');
    updateDashboard('total-earnings', earnings + ' ETH');
    updateDashboard('tasks-executed', tasks.toString());
    updateDashboard('payments-count', payments.toString());
    updateDashboard('active-agents-count', activeAgents.length.toString());
  }, 5000);
}

// Start dashboard after page load
window.addEventListener('load', initDashboard);

updateActiveAgentsBar();
</script>

</body>
</html>
