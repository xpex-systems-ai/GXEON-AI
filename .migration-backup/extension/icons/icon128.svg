<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="128" height="128" fill="#0a0e27" rx="18"/>
  
  <!-- Outer ring gold -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="#D4AF37" stroke-width="4"/>
  
  <!-- Inner decorative ring cyan -->
  <circle cx="64" cy="64" r="34" fill="none" stroke="#00FFFF" stroke-width="2" stroke-dasharray="8 4"/>
  
  <!-- Central G letter -->
  <text x="64" y="70" font-family="'Courier New', monospace" font-size="56" font-weight="bold" fill="#D4AF37" text-anchor="middle">G</text>
  
  <!-- Eye dot (predator vision) -->
  <circle cx="76" cy="54" r="5" fill="#00FFFF"/>
  
  <!-- Decorative corners -->
  <path d="M 18 32 L 26 32 L 26 24" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
  <path d="M 110 32 L 102 32 L 102 24" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
  <path d="M 18 96 L 26 96 L 26 104" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
  <path d="M 110 96 L 102 96 L 102 104" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Tech lines -->
  <line x1="64" y1="20" x2="64" y2="28" stroke="#D4AF37" stroke-width="2"/>
  <line x1="64" y1="100" x2="64" y2="108" stroke="#D4AF37" stroke-width="2"/>
  <line x1="20" y1="64" x2="28" y2="64" stroke="#D4AF37" stroke-width="2"/>
  <line x1="100" y1="64" x2="108" y2="64" stroke="#D4AF37" stroke-width="2"/>
