# GXEON Railway Deployment Configuration
# Multi-service deployment for autonomous revenue engine

services:
  # Main Unified Server (API + Webhooks)
  - name: gxeon-api
    buildCommand: cd server && npm install
    startCommand: node server/gxeon_production_unified.js
    env:
      - PORT=3001
      - NODE_ENV=production
    healthcheck:
      path: /v1/health
      port: 3001
    resources:
      memory: 512MB
      cpu: 1

  # Autonomous Revenue Engine
  - name: gxeon-revenue
    buildCommand: cd server && npm install
    startCommand: node server/autonomous_revenue_engine.js
    env:
      - PORT=3002
      - NODE_ENV=production
    healthcheck:
      path: /v1/observability/metrics
      port: 3002
    resources:
      memory: 512MB
      cpu: 1
    dependsOn:
      - gxeon-api

  # Dashboard (Next.js on Vercel - configured separately)
  # Vercel deployment uses vercel.json

databases:
  # Supabase is used externally
  # Connection via env vars

volumes:
  # No persistent volumes needed - all state in Supabase
