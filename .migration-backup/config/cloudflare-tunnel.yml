# ═══════════════════════════════════════════════════════════════════════════════
# CLOUDFLARE TUNNEL CONFIGURATION — GXEON Lighthouse Signal Provider
# ═══════════════════════════════════════════════════════════════════════════════
# Alternative to ngrok — permanent tunnel with custom domain
# 
# Setup:
# 1. Install cloudflared: https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/downloads/
# 2. Authenticate: cloudflared tunnel login
# 3. Create tunnel: cloudflared tunnel create gxeon-signals
# 4. Copy tunnel UUID to .env as CF_TUNNEL_ID
# 5. Run: cloudflared tunnel --config config/cloudflare-tunnel.yml run
# ═══════════════════════════════════════════════════════════════════════════════

# Tunnel ID (from cloudflared tunnel create)
tunnel: ${CF_TUNNEL_ID}

# Credentials file (auto-generated by cloudflared)
credentials-file: ~/.cloudflared/${CF_TUNNEL_ID}.json

# Transport logging
logfile: cloudflared.log

# Protocol (auto, http2, quic)
protocol: auto

# Metrics
metrics: localhost:45678

# Ingress rules — map public URLs to local services
ingress:
  # Primary WebSocket endpoint
  - hostname: signals.gxeon.io
    service: ws://localhost:8765
    originRequest:
      connectTimeout: 30s
      noTLSVerify: true
      httpHostHeader: localhost
      # WebSocket support
      websocket:
        enabled: true
        # Ping interval to keep connection alive
        keepAlivePingInterval: 30s
      
  # REST API / Metrics endpoint
  - hostname: api.gxeon.io
    service: http://localhost:8765
    originRequest:
      connectTimeout: 10s
      noTLSVerify: true
      
  # Fallback (catch-all)
  - service: http_status:404

# ═══════════════════════════════════════════════════════════════════════════════
# DNS SETUP REQUIRED:
# ═══════════════════════════════════════════════════════════════════════════════
# In Cloudflare Dashboard:
# 1. Add CNAME: signals.gxeon.io → ${CF_TUNNEL_ID}.cfargotunnel.com
# 2. Add CNAME: api.gxeon.io → ${CF_TUNNEL_ID}.cfargotunnel.com
# 3. Enable "Proxied" (orange cloud)
# 4. SSL/TLS mode: Full (strict)
# ═══════════════════════════════════════════════════════════════════════════════

# Additional settings (optional)
retries: 5
grace-period: 30s
