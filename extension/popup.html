<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GXEON PREDATOR v21.2</title>
    <style>
        /* ═══════════════════════════════════════════════════════════════════
           🎨 GXEON PREDATOR — Cyberpunk Gold Theme
           ═══════════════════════════════════════════════════════════════════ */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 380px;
            min-height: 500px;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f4a 50%, #0a0e27 100%);
            color: #D4AF37;
            font-family: 'Courier New', 'Monaco', monospace;
            padding: 20px;
            overflow-x: hidden;
        }
        
        /* Header */
        .header {
            text-align: center;
            border-bottom: 3px solid #D4AF37;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        
        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #D4AF37, 0 0 20px #D4AF37;
        }
        
        .subtitle {
            font-size: 11px;
            color: #00FFFF;
            margin-top: 5px;
            letter-spacing: 2px;
        }
        
        .version {
            font-size: 10px;
            color: #888;
            margin-top: 3px;
        }
        
        /* Status Box */
        .status-box {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid #D4AF37;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .status-row:last-child {
            margin-bottom: 0;
        }
        
        .status-label {
            font-size: 12px;
            color: #888;
        }
        
        .status-value {
            font-size: 13px;
            font-weight: bold;
            color: #fff;
        }
        
        .status-value.connected {
            color: #00FF00;
            text-shadow: 0 0 5px #00FF00;
        }
        
        .status-value.disconnected {
            color: #FF4444;
        }
        
        .status-value.scanning {
            color: #00FFFF;
            animation: pulse 1s infinite;
        }
        
        /* GARI Stats */
        .gari-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .stat-card {
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid #00FFFF;
            border-radius: 6px;
            padding: 12px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #00FFFF;
            text-shadow: 0 0 10px #00FFFF;
        }
        
        .stat-label {
            font-size: 10px;
            color: #888;
            margin-top: 5px;
            text-transform: uppercase;
        }
        
        /* Opportunities List */
        .opportunities-section {
            margin-bottom: 15px;
        }
        
        .section-title {
            font-size: 12px;
            color: #D4AF37;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .opportunity-list {
            max-height: 200px;
            overflow-y: auto;
        }
        
        .opportunity-item {
            background: rgba(255, 255, 255, 0.05);
            border-left: 3px solid #D4AF37;
            border-radius: 0 6px 6px 0;
            padding: 10px 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .opportunity-item:hover {
            background: rgba(212, 175, 55, 0.2);
            transform: translateX(5px);
        }
        
        .opportunity-item.urgent {
            border-left-color: #FF4444;
            animation: pulse-red 2s infinite;
        }
        
        .opportunity-item.high {
            border-left-color: #D4AF37;
        }
        
        .opportunity-item.normal {
            border-left-color: #00FFFF;
        }
        
        .opp-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        
        .opp-profit {
            font-size: 16px;
            font-weight: bold;
            color: #00FF00;
        }
        
        .opp-roi {
            font-size: 11px;
            color: #D4AF37;
            background: rgba(212, 175, 55, 0.2);
            padding: 2px 6px;
            border-radius: 3px;
        }
        
        .opp-details {
            font-size: 10px;
            color: #888;
        }
        
        .opp-contract {
            font-family: monospace;
            color: #00FFFF;
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: #666;
        }
        
        .empty-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        
        .empty-text {
            font-size: 12px;
        }
        
        /* Buttons */
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #D4AF37 0%, #ffd700 100%);
            color: #000;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.6);
        }
        
        .btn-secondary {
            background: transparent;
            border: 1px solid #00FFFF;
            color: #00FFFF;
        }
        
        .btn-secondary:hover {
            background: rgba(0, 255, 255, 0.1);
        }
        
        .btn-danger {
            background: transparent;
            border: 1px solid #FF4444;
            color: #FF4444;
            font-size: 11px;
            padding: 8px;
        }
        
        .btn-danger:hover {
            background: rgba(255, 68, 68, 0.1);
        }
        
        /* Footer */
        .footer {
            border-top: 1px solid #333;
            padding-top: 15px;
            margin-top: 15px;
            text-align: center;
        }
        
        .footer-text {
            font-size: 10px;
            color: #666;
        }
        
        .footer-link {
            color: #D4AF37;
            text-decoration: none;
        }
        
        /* Animations */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        @keyframes pulse-red {
            0%, 100% { box-shadow: 0 0 5px #FF4444; }
            50% { box-shadow: 0 0 20px #FF4444; }
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        
        ::-webkit-scrollbar-thumb {
            background: #D4AF37;
            border-radius: 3px;
        }
        
        /* Hidden */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="logo">🦁 GXEON</div>
        <div class="subtitle">PREDATOR</div>
        <div class="version">v21.2 • DNA_CONVERSAO</div>
    </div>
    
    <!-- Status -->
    <div class="status-box">
        <div class="status-row">
            <span class="status-label">Status do Radar:</span>
            <span id="radar-status" class="status-value scanning">SCANNING...</span>
        </div>
        <div class="status-row">
            <span class="status-label">Servidor:</span>
            <span id="server-status" class="status-value disconnected">OFFLINE</span>
        </div>
        <div class="status-row">
            <span class="status-label">Última Atualização:</span>
            <span id="last-update" class="status-value">--:--:--</span>
        </div>
    </div>
    
    <!-- GARI Stats -->
    <div class="gari-stats">
        <div class="stat-card">
            <div id="opp-count" class="stat-value">0</div>
            <div class="stat-label">Achados</div>
        </div>
        <div class="stat-card">
            <div id="total-profit" class="stat-value">$0</div>
            <div class="stat-label">Lucro Total</div>
        </div>
    </div>
    
    <!-- Opportunities -->
    <div class="opportunities-section">
        <div class="section-title">
            🧹 OPORTUNIDADES GARI
        </div>
        <div id="opportunity-list" class="opportunity-list">
            <div class="empty-state">
                <div class="empty-icon">🔍</div>
                <div class="empty-text">Aguardando oportunidades...</div>
            </div>
        </div>
    </div>
    
    <!-- Actions -->
    <button id="btn-refresh" class="btn btn-secondary">🔄 ATUALIZAR</button>
    <button id="btn-clear" class="btn btn-danger">🗑️ LIMPAR HISTÓRICO</button>
    
    <!-- Footer -->
    <div class="footer">
        <div class="footer-text">
            Oráculo de Arqueologia Digital<br>
            <a href="https://gxeon-ia-production.up.railway.app" target="_blank" class="footer-link">
                Ver Dashboard →
            </a>
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
