name: GXEON Typecheck

on:
  pull_request:
  push:
    branches: [main, work]
  workflow_dispatch:

jobs:
  typecheck:
    name: TypeScript workspace validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run typecheck
        run: pnpm run typecheck
      - name: Audit OS transport contract tests
        run: node --experimental-strip-types --test scripts/tests/audit-os-transport.test.mjs
