name: GXEON Runtime Sync

on:
  push:
    branches: [ main, work ]
  workflow_dispatch:

jobs:
  build-ordering-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: npm run build:libs

  runtime-deployment-validation:
    runs-on: ubuntu-latest
    needs: build-ordering-validation
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: npm run runtime:validate
      - run: npm run build:apps

  autonomous-recovery-validation:
    runs-on: ubuntu-latest
    needs: runtime-deployment-validation
    steps:
      - uses: actions/checkout@v4
      - run: node -e "const r=require('./server/runtime/runtimeRecovery.cjs').getRecoveryStatus(); if(!r.auto_retry_enabled) process.exit(1); console.log('ok')"
      - run: node -e "const r=require('./server/runtime/railwayProduction.cjs').getRailwayRuntimeStatus(); if(!r.railway_runtime) process.exit(1); console.log('railway ok')"
      - run: node -e "const r=require('./server/runtime/radarContinuity.cjs').getRadarStatus(); if(r.radar!=='ACTIVE') process.exit(1); console.log('radar ok')"

  dashboard-availability-validation:
    runs-on: ubuntu-latest
    needs: runtime-deployment-validation
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/gxeon-dashboard run build

  artifact-integrity-validation:
    runs-on: ubuntu-latest
    needs: [autonomous-recovery-validation, dashboard-availability-validation]
    steps:
      - uses: actions/checkout@v4
      - name: Create non-claiming CI evidence artifacts
        run: |
          mkdir -p artifacts
          echo '{"status":"CI_VALIDATED_BUILD_ONLY","production_claim":false}' > artifacts/runtime-sync-report.json
          echo '{"status":"CI_VALIDATED_BUILD_ONLY","production_claim":false}' > artifacts/runtime-governance-report.json
          echo '{"deployment":"NOT_VERIFIED_BY_CI","production_claim":false}' > artifacts/deployment-integrity-report.json
          echo '{"production_runtime":"NOT_VERIFIED_BY_CI","production_claim":false}' > artifacts/production-runtime-report.json
          echo '{"status":"CI_SNAPSHOT_ONLY","production_claim":false}' > artifacts/runtime-snapshot-report.json
          echo '{"railway_runtime":"CONFIG_VALIDATED_ONLY","production_claim":false}' > artifacts/railway-runtime-report.json
          echo '{"providers":"UNVERIFIED_IN_CI","production_claim":false,"reason":"production provider secrets are intentionally absent from CI"}' > artifacts/provider-health-report.json
          echo '{"radar":"CODE_PATH_VALIDATED_ONLY","production_claim":false}' > artifacts/radar-runtime-report.json
          echo '{"websocket":"NOT_VERIFIED_BY_CI","production_claim":false}' > artifacts/websocket-runtime-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: gxeon-runtime-sync-artifacts
          path: |
            artifacts/runtime-governance-report.json
            artifacts/runtime-sync-report.json
            artifacts/deployment-integrity-report.json
            artifacts/production-runtime-report.json
            artifacts/runtime-snapshot-report.json
            artifacts/railway-runtime-report.json
            artifacts/provider-health-report.json
            artifacts/radar-runtime-report.json
            artifacts/websocket-runtime-report.json
