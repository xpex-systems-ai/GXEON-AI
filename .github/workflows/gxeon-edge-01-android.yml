name: GXEON EDGE-01 Android

on:
  push:
    branches:
      - main
      - feat/gxeon-edge-01-apk
      - feat/gxeon-edge-01-v0.3-control-layer
    paths:
      - 'apps/gxeon-edge-01/**'
      - '.github/workflows/gxeon-edge-01-android.yml'
  pull_request:
    paths:
      - 'apps/gxeon-edge-01/**'
      - '.github/workflows/gxeon-edge-01-android.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gxeon-edge-01
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable EDGE debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: gxeon-edge-01-debug-keystore-v1

      - name: Ensure stable EDGE debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=GXEON EDGE-01 Debug,O=XPEX Systems,C=BR"
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gxeon-edge-01-debug-apk
          path: apps/gxeon-edge-01/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
