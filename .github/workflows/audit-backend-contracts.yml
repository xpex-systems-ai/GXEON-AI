name: GXEON Audit Backend Contract Tests

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/services/audit*"
      - "scripts/tests/audit-read-contracts.test.mjs"
      - ".github/workflows/audit-backend-contracts.yml"
  workflow_dispatch:

jobs:
  audit-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate read-only provider data boundaries
        run: node --experimental-strip-types --test scripts/tests/audit-read-contracts.test.mjs
