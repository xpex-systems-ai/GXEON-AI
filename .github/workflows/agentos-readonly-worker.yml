name: GXEON AgentOS Read-only Worker
on:
  pull_request:
    paths:
      - "artifacts/api-server/src/agentos/readOnlyWorker.ts"
      - "artifacts/api-server/src/routes/agentosGenesis.ts"
      - "scripts/tests/agentos-readonly-worker-contracts.test.mjs"
      - "scripts/agentos-readonly-worker-demo.mjs"
      - "docs/agentos/SYSTEMS_COMMAND_READ_CONTRACT_V1.md"
      - ".github/workflows/agentos-readonly-worker.yml"
  workflow_dispatch:
jobs:
  fixture-readonly-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run tool invocation, independent verification and negative security tests
        run: node --experimental-strip-types --test scripts/tests/agentos-readonly-worker-contracts.test.mjs
      - name: Demonstrate audit findings and human approval boundary
        run: node --experimental-strip-types scripts/agentos-readonly-worker-demo.mjs
