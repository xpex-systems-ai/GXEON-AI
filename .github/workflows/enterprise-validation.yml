name: GXEON Enterprise Validation

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, 'feature/**', 'hotfix/**']
  workflow_dispatch:

jobs:
  direct-main-guard:
    name: Branch governance gate
    runs-on: ubuntu-latest
    steps:
      - name: Block direct main pushes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'Merge pull request')
        run: |
          echo "Direct pushes to main are not allowed. Use a pull request."
          exit 1
      - name: Governance accepted
        run: echo "Branch governance gate passed"

  enterprise-validation:
    name: Enterprise runtime validation
    runs-on: ubuntu-latest
    needs: direct-main-guard
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      - name: Normalize GitHub git transport
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/
      - name: Deterministic install
        run: npm ci
      - name: Enterprise validation
        run: npm run validate:enterprise
      - name: Generate recovery report
        if: always()
        run: npm run recovery:report || true
      - name: Upload recovery reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-recovery-${{ github.run_id }}
          path: reports/recovery/*.json
          if-no-files-found: ignore
