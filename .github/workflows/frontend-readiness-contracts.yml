name: GXEON Frontend Contract Safety
on:
  pull_request:
    paths:
      - "artifacts/gxeon-dashboard/src/pages/FinancialLedgerPage.tsx"
      - "artifacts/gxeon-dashboard/src/pages/GitHubDemandRadarPage.tsx"
      - "artifacts/gxeon-dashboard/src/services/monetizationService.ts"
      - "artifacts/gxeon-dashboard/src/services/radarService.ts"
      - "artifacts/gxeon-dashboard/src/lib/ledgerMetricValues.ts"
      - "scripts/tests/frontend-readiness-contracts.test.mjs"
      - ".github/workflows/frontend-readiness-contracts.yml"
  workflow_dispatch:
jobs:
  frontend-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify finance, API and preview-only frontend contracts
        run: node --experimental-strip-types --test scripts/tests/frontend-readiness-contracts.test.mjs
